      - pipewire-pulse
      - "@virtualization"
      - qt6-qtmultimedia
      - rmpc
      - satty
      - slurp
      - swaybg
      - swayidle
      - swaylock
      - tesseract
      - tesseract-langpack-eng
      - thunar
      - thunar-archive-plugin
      - timidity++
      - gnu-free-fonts-common
