# System packages, one block per supported distro.
#
# This replaces `_install/default/packages/*` and the PACKAGES_* variables of the
# old `dotfriedrice-config`. The semantics are the same as before:
#
#   <list>         the default packages
#   <list>_extras  packages added on top of the defaults
#   <list>_skip    packages removed from the defaults
#
# The effective list is (<list> + <list>_extras) - <list>_skip. To change it for
# a single machine, override the key in the `[data]` table of
# ~/.config/chezmoi/chezmoi.toml (lists are replaced, not merged).
#
# Only the block that matches the machine's distro is used. GUI lists are only
# used when `gui` is true.

packages:
  # Ask for confirmation (false) or pass -y / --noconfirm (true) to the package manager.
  auto_confirm: false

  fedora:
    cli:
      - aspell
      - aspell-en
      - bat
      - bc
      - bind-utils
      - btop
      - curl
      - diffutils
      - dust
      - eza
      - fastfetch
      - fd-find
      - ffmpeg
      - fontconfig
      - fzf
      - git
      - git-delta
      - gnupg2
      - ImageMagick
      - inotify-tools
      - jq
      - less
      - libqalculate
      - man-db
      - man-pages
      - nmap-ncat
      - openssh
      - pwgen
      - ripgrep
      - rsync
      - ShellCheck
      - shfmt
      - smartmontools
      - strace
      - tmux
      - unzip
      - usbutils
      - wev
      - wget
      - whois
      - wl-clipboard
      - xz
      - yq
      - zip
      - zoxide
      - zsh
    cli_extras:
      # - hd-idle
      - keyd
      # - kdeconnectd
      - trans
      - earlyoom
    cli_skip:
      - aspell
      - aspell-en
    gui:
