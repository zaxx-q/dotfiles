# Font configuration
font_family Inconsolata Nerd Font
font_size 11
disable_ligatures always

# Window configuration
hide_window_decorations yes
window_padding_width 2 4

# Scrollback
scrollback_lines 100000000

# Terminal features
mouse_hide_wait 0
copy_on_select clipboard
confirm_os_window_close 0

# Key bindings for common actions
map ctrl+shift+n new_os_window
map ctrl+shift+t new_tab
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Use legacy xterm sequences for left/right arrows, which some apps use to
# switch tabs. Alt+arrow keys have no Kitty bindings and pass through to tmux.
map left send_text normal,application \e[D
map right send_text normal,application \e[C

# Shell integration
shell_integration enabled
map shift+enter send_text normal,application \n
# Pi
map alt+backspace send_text normal,application \e\x7f

# Aesthetics
background_opacity 0.5
background_blur 1

# Color generation and per-machine overrides
include themes/noctalia.conf
