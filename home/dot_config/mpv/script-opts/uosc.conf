# Timeline
timeline_style=line
timeline_line_width=2
timeline_size=40
timeline_border=1
timeline_step=5
timeline_cache=yes

# Progress bar (minimized timeline)
progress=windowed
progress_size=2
progress_line_width=20

# Controls
controls=menu,gap,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<stream>stream-quality,gap,space,<video,audio>speed,space,shuffle,loop-playlist,loop-file,gap,prev,items,next,gap,fullscreen
controls_size=32
controls_margin=8
controls_spacing=2

# Volume
volume=right
volume_size=40
volume_border=1
volume_step=1

# Speed widget
speed_step=0.1
speed_step_is_factor=no

# Menus
menu_item_height=36
menu_min_width=260
menu_padding=4
menu_type_to_search=yes

# Top bar
top_bar=no-border
top_bar_persistency=audio
top_bar_size=40
top_bar_controls=right
top_bar_title=yes
top_bar_flash_on=video,audio

# Window
window_border_size=1

# Appearance
scale=1
scale_fullscreen=1.3
font_scale=1
text_border=1.2
border_radius=4
animation_duration=100
flash_duration=1000
proximity_in=40
proximity_out=120
font_bold=no

# Behavior
destination_time=playtime-remaining
time_precision=0
buffered_time_threshold=60
autohide=no
pause_indicator=flash
autoload=no
use_trash=yes
shuffle=no
