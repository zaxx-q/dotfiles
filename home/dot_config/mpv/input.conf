# ═══════════════════════════════════════════════════════════════════════
# Core Playback
# ═══════════════════════════════════════════════════════════════════════

space        cycle pause; script-binding uosc/flash-pause-indicator
right        seek  3
left         seek -3
shift+right  seek  30; script-binding uosc/flash-timeline
shift+left   seek -30; script-binding uosc/flash-timeline

m            no-osd cycle mute; script-binding uosc/flash-volume
up           no-osd add volume  10; script-binding uosc/flash-volume
down         no-osd add volume -10; script-binding uosc/flash-volume

[            no-osd add speed -0.1; script-binding uosc/flash-speed
]            no-osd add speed  0.1; script-binding uosc/flash-speed
{            no-osd add speed -0.5; script-binding uosc/flash-speed
}            no-osd add speed  0.5; script-binding uosc/flash-speed
\            no-osd set speed 1.0;  script-binding uosc/flash-speed

# ═══════════════════════════════════════════════════════════════════════
# Playlist / Navigation
# ═══════════════════════════════════════════════════════════════════════

>            script-binding uosc/next; script-message-to uosc flash-elements top_bar,timeline
<            script-binding uosc/prev; script-message-to uosc flash-elements top_bar,timeline

# ═══════════════════════════════════════════════════════════════════════
# Subtitles
# ═══════════════════════════════════════════════════════════════════════

k            cycle-values sub-ass-override "force" "no"
Alt+j        cycle secondary-sid
=            add sub-font-size +1
-            add sub-font-size -1

# ═══════════════════════════════════════════════════════════════════════
# View Controls
# ═══════════════════════════════════════════════════════════════════════

# Toggle cropping a video on resize instead of scaling it. You can combine this
# with holding CTRL and moving the mouse to pan around as well.
c cycle-values video-unscaled no yes

# Rotate and flip media.
r            cycle_values video-rotate 90 180 270 0
CTRL+r       vf toggle hflip
CTRL+SHIFT+r vf toggle vflip

# Scale: +/- the media size and also the mpv window.
# Zoom: +/- the media size but keep the mpv window size the same as it is.
CTRL+WHEEL_UP         add window-scale 0.05
CTRL+WHEEL_DOWN       add window-scale -0.05
CTRL+SHIFT+WHEEL_UP   add video-zoom 0.05
CTRL+SHIFT+WHEEL_DOWN add video-zoom -0.05
CTRL+MBTN_MID         script-binding zoom_reset
CTRL+SHIFT+MBTN_MID   script-binding zoom_reset

# ═══════════════════════════════════════════════════════════════════════
# Clipboard & Copy
# ═══════════════════════════════════════════════════════════════════════

ctrl+c       script-binding uosc/copy-to-clipboard
ctrl+v       script-binding uosc/paste
shift+v      script-binding uosc/paste-to-playlist

# ═══════════════════════════════════════════════════════════════════════
# Clips (mkclip)
# ═══════════════════════════════════════════════════════════════════════

F1 script-binding mkclip_mark_start
F2 script-binding mkclip_mark_end
F3 script-binding mkclip_create
F4 script-binding mkclip_clear_marks

# ═══════════════════════════════════════════════════════════════════════
# Seek-to (type a timestamp to jump to)
# ═══════════════════════════════════════════════════════════════════════

F5 script-message-to seek_to toggle-seeker

# ═══════════════════════════════════════════════════════════════════════
# Mouse
# ═══════════════════════════════════════════════════════════════════════

MBTN_MID     quit
MBTN_BACK    playlist-prev
MBTN_FORWARD playlist-next

# ═══════════════════════════════════════════════════════════════════════
# Shaders (upscaling)
# ═══════════════════════════════════════════════════════════════════════

y cycle-values glsl-shaders "~~/shaders/nnedi3-nns128-win8x4.hook" "~~/shaders/ArtCNN_C4F32.glsl" ""

# ═══════════════════════════════════════════════════════════════════════
# Stream Quality
# ═══════════════════════════════════════════════════════════════════════

ctrl+f script-binding selectformat/menu

# ═══════════════════════════════════════════════════════════════════════
# Profiles
# ═══════════════════════════════════════════════════════════════════════

# Toggle between battery-saving and full quality profiles.
B        script-message cycle-profile

# ═══════════════════════════════════════════════════════════════════════
# Misc
# ═══════════════════════════════════════════════════════════════════════

# Close all open instances of mpv.
CTRL+q run killall mpv
