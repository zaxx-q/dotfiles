# ──────────────────────────────────────────────────────────────────────
# Interface
# ──────────────────────────────────────────────────────────────────────
osc=no                                   # disabled for uosc
osd-bar=no                               # uosc handles this
osd-duration=2000

# ──────────────────────────────────────────────────────────────────────
# Window
# ──────────────────────────────────────────────────────────────────────
# Scale large media files to your display's height and keep the aspect ratio.
# autofit-larger=100%x100%

# restrict maximum size of the window when it opens - large windows wont fill the screen upon open
autofit-larger=1280x720

# When resizing the mpv window horizontally, crop the media instead of scaling.
# You can still scale if you resize mpv vertically.
panscan=1.0

title="${filename}"
idle=yes
force-window=yes

# ──────────────────────────────────────────────────────────────────────
# Playlist
# ──────────────────────────────────────────────────────────────────────
# Allow going to the next / previous media file in the current directory even
# if you open an individual file (such as opening a file with a file explorer).
#
# When using "same", images will only cycle images and the same goes with videos.
#
# Also don't recurse into directories, "ignore" locks it to the current directory.
autocreate-playlist=same
directory-mode=ignore
directory-filter-types=video,audio

# Instead of closing after a video finishes, keep repeating it. This also keeps
# images open until you close it.
loop-file=inf

# When you reach the start or end of a directory / playlist, loop back around.
loop-playlist=inf

# ──────────────────────────────────────────────────────────────────────
# Watch Later
# ──────────────────────────────────────────────────────────────────────
watch-later-options=start,sid,secondary-sid,sub-scale
save-position-on-quit=yes

# ──────────────────────────────────────────────────────────────────────
# Video
# ──────────────────────────────────────────────────────────────────────
vo=gpu-next
hwdec=auto
profile=high-quality
scale-antiring=0.6
tone-mapping=auto
hr-seek=yes

# Clear a few common properties when moving between media files. This list can
# grow very large (hue, saturation, etc.), let's start with this for now.
reset-on-next-file=window-scale,video-zoom,video-rotate,video-align-x,video-align-y,video-aspect-override,video-pan-x,video-pan-y,panscan,vf

# ──────────────────────────────────────────────────────────────────────
# Audio
# ──────────────────────────────────────────────────────────────────────
audio-file-auto=fuzzy
volume-max=150
alang=jpn,ja,ko,eng,en,enUS,en-US

# ──────────────────────────────────────────────────────────────────────
# Subtitles
# ──────────────────────────────────────────────────────────────────────
sub-auto=fuzzy
sub-ass-override=force
sub-font="Inter Variable"
sub-font-size=32
sub-border-size=2
sub-back-color=000000
sub-shadow-offset=1
sub-use-margins=no
slang=enm,eng,en,id
secondary-sub-pos=6

# ──────────────────────────────────────────────────────────────────────
# Streaming
# ──────────────────────────────────────────────────────────────────────
ytdl-format="bv*+ba/b"
hls-bitrate=max
demuxer-max-bytes=500000KiB
force-seekable=yes
ytdl-raw-options=cookies="/drive/share/secrets/yt-cookies.txt",remote-components="ejs:github"

# ──────────────────────────────────────────────────────────────────────
# Terminal
# ──────────────────────────────────────────────────────────────────────
msg-color=yes
msg-module=yes
msg-level=ffmpeg/video=error

# ──────────────────────────────────────────────────────────────────────
# Screenshots
# ──────────────────────────────────────────────────────────────────────
screenshot-dir=~/tmp/pictures/mpv
screenshot-template="%F-%p-%n"
screenshot-format=jxl

# ──────────────────────────────────────────────────────────────────────
# Profiles
# ──────────────────────────────────────────────────────────────────────
# Use a different sub font for audio-only files (e.g. lyrics display).
[audio]
sub-font="Inter Variable"
profile-cond=audio_codec and (container_fps == nil or container_fps == 1)

# Video profile (redundant sub-font ensures consistency).
[video]
sub-font="Inter Variable"
profile-cond=video_codec and (container_fps > 1)

# AVIF images: keep open like other images.
[extension.avif]
image-display-duration=inf
loop-file=inf

# Lighter settings when on battery power (applied by auto-battery.lua).
# Toggle with B key (see input.conf).
[battery]
profile-desc=Battery-saving profile
vo=gpu
profile=fast
hwdec=auto-safe

# Undo the battery profile — restore full quality.
[quality]
profile-desc=Full quality (override battery)
vo=gpu-next
profile=high-quality
hwdec=auto

# Lightweight profile for heavy 4K HDR content (e.g. iPhone .MOV files)
# Triggers on 4K+ HEVC at high bitrate to avoid stutter
[4k-hevc]
profile-desc=Reduce processing for 4K60 HDR content
profile-cond=p["video-params/w"] ~= nil and p["video-params/h"] ~= nil and (p["video-params/w"] >= 2160 or p["video-params/h"] >= 2160) and (container_fps or 0) > 50
profile=fast
vo=gpu-next
hwdec=auto
scale-antiring=0
deband=no

# mpv is really good at viewing images, not just videos!
#
# vo=x11 disables hardware acceleration for images which helps prevent GPU
# memory from being heavily consumed in Wayland. wlshm is not being used because
# this shares memory with niri and niri never releases this memory back.
#
# force-window=no ensures the initial image opened is the correct size. It's not
# needed with x11 but if wlshm gets addressed it is needed.
[image-settings]
profile-cond=p["current-tracks/video/image"]
vo=x11
#vo=wlshm
force-window=no
